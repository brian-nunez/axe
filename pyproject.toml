[project]
name = "axedevtools"
version = "0.0.0"
description = "Agent-driven accessibility auditing through the axe DevTools extension"
requires-python = ">=3.11"

# The Python side of the run: the LangGraph graph and its MCP client.
#
# Pinned, because the graph depends on `Command(graph=Command.PARENT)` routing
# and on `load_mcp_tools` over a session the caller holds open — both of which
# have moved between releases. `uv.lock` pins the rest of the tree; these are
# the versions the graph was written and measured against.
dependencies = [
    "langchain==1.4.0",
    "langchain-core==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.0",
    "mcp==1.30.0",
    "PyYAML==6.0.3",
]

[tool.uv]
# `graph/` is run as a module from the repo root, not installed. Without this
# uv looks for a build backend and fails on a project that ships no package.
package = false

# Never fetch an interpreter. A pinned CPython build is a download from GitHub,
# which a corporate proxy blocks — and nothing here needs a specific build, so
# whatever python the machine already has is the right one.
python-downloads = "never"
python-preference = "only-system"
